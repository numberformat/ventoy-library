[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ventoy-library"
dynamic = ["version"]
description = "Safely plan and manage a library of bootable images on ordinary filesystems"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "platformdirs>=4,<5", "packaging>=24", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "build>=1.2"]

[project.scripts]
ventoy-library = "ventoy_library.cli:main"

[project.urls]
Repository = "https://github.com/numberformat/ventoy-library"
Issues = "https://github.com/numberformat/ventoy-library/issues"

[tool.hatch.version]
path = "src/ventoy_library/metadata.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ventoy_library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
